<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div class="phone">
  <div class="app-header" id="appHeader"></div>

  <div class="content" id="content">
    <p class="step-instruction">Loading recipes…</p>
  </div>
</div>

<!-- storage.js before app.js — order matters since these are plain global
     scripts (no bundler / no ES modules), which keeps things simple to run
     straight from VS Code's Live Server or GitHub Pages with no build step.
     Recipe/technique data itself is fetched at runtime from data/*.json,
     not bundled here — see js/app.js loadData(). -->
<script src="js/storage.js"></script>
<script src="js/app.js"></script>

</body>
</html>
